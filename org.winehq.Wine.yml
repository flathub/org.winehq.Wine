id: org.winehq.Wine
sdk: org.freedesktop.Sdk
runtime: org.freedesktop.Platform
runtime-version: '25.08'
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=all
  - --socket=pulseaudio
  - --share=network
  - --allow=multiarch
  - --allow=devel
  - --system-talk-name=org.freedesktop.UDisks2
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  - --filesystem=xdg-download
  - --env=WINEPREFIX=/var/data/wine
command: wine
rename-desktop-file: wine.desktop
rename-icon: wine

add-extensions:
  org.winehq.Wine.gecko-wow64:
    directory: share/wine/gecko
    bundle: true

  org.winehq.Wine.mono-wow64:
    directory: share/wine/mono
    bundle: true

sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64

build-options:
  append-path: /usr/lib/sdk/mingw-w64/bin
  env:
    PERL5LIB: /app/lib/perl5/
    PERL_MM_OPT: INSTALL_BASE=/app

separate-locales: false
cleanup:
  - '*.a'
  - '*.la'
  - /share/et
  - /share/examples
  - /share/man
  - /include
  - /lib/pkgconfig
modules:

  # Wine dependencies

  - name: krb5
    subdir: src
    config-opts:
      - --localstatedir=/var/lib
      - --sbindir=${FLATPAK_DEST}/bin
      - --disable-rpath
    post-install:
      - install -Dm644 ../krb5.conf -t /app/etc
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
        x-checker-data:
          type: anitya
          project-id: 13287
          stable-only: true
          url-template: https://kerberos.org/dist/krb5/${version0}.${version1}/krb5-${version0}.${version1}.${version2}.tar.gz
      - type: file
        path: krb5.conf

  - name: unixodbc
    sources:
      - type: archive
        url: https://www.unixodbc.org/unixODBC-2.3.14.tar.gz
        sha256: 4e2814de3e01fc30b0b9f75e83bb5aba91ab0384ee951286504bb70205524771
        x-checker-data:
          type: anitya
          project-id: 7344
          stable-only: true
          url-template: https://www.unixodbc.org/unixODBC-$version.tar.gz

  - name: opencl-headers
    buildsystem: simple
    build-commands:
      - cp -a CL $FLATPAK_DEST/include/
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v2025.07.22.tar.gz
        sha256: 98f0a3ea26b4aec051e533cb1750db2998ab8e82eda97269ed6efe66ec94a240
        x-checker-data:
          type: anitya
          project-id: 223257
          stable-only: true
          url-template: https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v$version.tar.gz

  # Samba + dependencies - For ntlm_auth and other functionalities in Wine

  - name: parse-yapp
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make
      - make install
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/W/WB/WBRASWELL/Parse-Yapp-1.21.tar.gz
        sha256: 3810e998308fba2e0f4f26043035032b027ce51ce5c8a52a8b8e340ca65f13e5
        x-checker-data:
          type: anitya
          project-id: 3197
          stable-only: true
          url-template: https://cpan.metacpan.org/authors/id/W/WB/WBRASWELL/Parse-Yapp-$version.tar.gz

  - name: rpcsvc-proto
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/thkukuk/rpcsvc-proto/releases/download/v1.4.4/rpcsvc-proto-1.4.4.tar.xz
        sha256: 81c3aa27edb5d8a18ef027081ebb984234d5b5860c65bd99d4ac8f03145a558b
        x-checker-data:
          type: anitya
          project-id: 155452
          stable-only: true
          url-template: https://github.com/thkukuk/rpcsvc-proto/releases/download/v$version/rpcsvc-proto-$version.tar.xz

  - name: samba
    config-opts:
      - --sbindir=/app/bin
      - --libdir=/app/lib
      - --libexecdir=/app/lib/libexec
      - --localstatedir=/var
      - --sharedstatedir=/var/lib
      - --enable-fhs
      - --disable-rpath
      - --disable-rpath-install
      - --disable-python
      - --disable-cups
      - --disable-iprint
      - --without-json
      - --without-ad-dc
      - --without-ads
      - --without-pam
      - --without-ldap
      - --without-acl-support
      - --without-systemd
      - --without-ldb-lmdb
    sources:
      - type: archive
        url: https://samba.org/samba/ftp/stable/samba-4.24.1.tar.gz
        sha256: 217151ca318a5576f8e0de72ba0acdf08157ecf12adac42d1af86db0b09a5f5a
        x-checker-data:
          type: anitya
          project-id: 4758
          stable-only: true
          url-template: https://samba.org/samba/ftp/stable/samba-$version.tar.gz

  # Wine WOW64 build

  - name: wine
    config-opts:
      - --libdir=/app/lib
      - --enable-archs=i386,x86_64
      - --disable-winemenubuilder
      - --disable-tests
    make-install-args:
      - LDCONFIG=/bin/true
      - UPDATE_DESKTOP_DATABASE=/bin/true
      - INSTALL_PROGRAM_FLAGS=-s
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz
        sha256: c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
        x-addons-url: &wine-addons-url >-
          https://gitlab.winehq.org/wine/wine/-/raw/stable/dlls/appwiz.cpl/addons.c
        x-checker-data:
          type: html
          url: https://gitlab.winehq.org/wine/wine/-/raw/stable/VERSION
          version-pattern: Wine version (\d[\d\w\.-]+\d)
          url-template: https://dl.winehq.org/wine/source/$major.$minor/wine-$version.tar.xz
          is-main-source: true

  # Tools

  - name: winetricks
    no-autogen: true
    make-install-args:
      - PREFIX=/app
    sources:
      - type: git
        url: https://github.com/Winetricks/winetricks.git
        tag: '20260125'
        commit: b76e1ee79ac57d7aceb384f74518fc423265810c
        x-checker-data:
          type: git
          tag-pattern: ^(\d+)$
    modules:

      - name: 7zip
        buildsystem: simple
        subdir: CPP/7zip/Bundles/Alone2
        build-commands:
          - make -j $FLATPAK_BUILDER_N_JOBS -f makefile.gcc
          - install -Dm755 ./_o/7zz -t /app/bin
          - ln -s /app/bin/7zz /app/bin/7za
          - ln -s /app/bin/7zz /app/bin/7z
        sources:
          - type: git
            url: https://github.com/ip7z/7zip.git
            tag: '26.01'
            commit: 8c63d71ff886bda90c86db28466287f977374237
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+)$

      - name: cabextract
        sources:
          - type: archive
            url: https://www.cabextract.org.uk/cabextract-1.11.tar.gz
            sha256: b5546db1155e4c718ff3d4b278573604f30dd64c3c5bfd4657cd089b823a3ac6
            x-checker-data:
              type: anitya
              project-id: 245
              stable-only: true
              url-template: https://www.cabextract.org.uk/cabextract-$version.tar.gz

  # Bundled extensions

  - name: wine-gecko
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/wine/gecko/
      - cp -a wine-gecko-* ${FLATPAK_DEST}/share/wine/gecko/
    post-install:
      - >-
        install -Dm644
        -t ${FLATPAK_DEST}/share/wine/gecko/share/metainfo/
        ${FLATPAK_ID}.gecko-wow64.metainfo.xml
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86.tar.xz
        strip-components: 0
        sha256: 2cfc8d5c948602e21eff8a78613e1826f2d033df9672cace87fed56e8310afb6
        x-checker-data:
          type: html
          url: *wine-addons-url
          version-pattern: GECKO_VERSION\s+"(\d[\d\.]+\d)"
          url-template: https://dl.winehq.org/wine/wine-gecko/$version/wine-gecko-$version-x86.tar.xz
      - type: archive
        url: https://dl.winehq.org/wine/wine-gecko/2.47.4/wine-gecko-2.47.4-x86_64.tar.xz
        strip-components: 0
        sha256: fd88fc7e537d058d7a8abf0c1ebc90c574892a466de86706a26d254710a82814
        x-checker-data:
          type: html
          url: *wine-addons-url
          version-pattern: GECKO_VERSION\s+"(\d[\d\.]+\d)"
          url-template: https://dl.winehq.org/wine/wine-gecko/$version/wine-gecko-$version-x86_64.tar.xz
      - type: file
        path: org.winehq.Wine.gecko-wow64.metainfo.xml

  - name: wine-mono
    buildsystem: simple
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/wine/mono/
      - cp -a wine-mono-* ${FLATPAK_DEST}/share/wine/mono/
    post-install:
      - >-
        install -Dm644
        -t ${FLATPAK_DEST}/share/wine/mono/share/metainfo/
        ${FLATPAK_ID}.mono-wow64.metainfo.xml
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/wine-mono/10.4.1/wine-mono-10.4.1-x86.tar.xz
        strip-components: 0
        sha256: a16606ef0724202e6a6848ece6e0cbba64d11e2f11aefe744af1d93c6d9f99bb
        x-checker-data:
          type: html
          url: *wine-addons-url
          version-pattern: MONO_VERSION\s+"(\d[\d\.]+\d)"
          url-template: https://dl.winehq.org/wine/wine-mono/$version/wine-mono-$version-x86.tar.xz
      - type: file
        path: org.winehq.Wine.mono-wow64.metainfo.xml

  # Flatpak bundle

  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - |
        icondir=${FLATPAK_DEST}/share/icons/hicolor
        install -Dm644 wine-logo.svg ${icondir}/scalable/apps/wine.svg
        for s in 16 24 32 48 64 128 256; do
          mkdir -p ${icondir}/${s}x${s}/apps
          rsvg-convert -h ${s} -a -o ${icondir}/${s}x${s}/apps/wine.png ${icondir}/scalable/apps/wine.svg
        done
    sources:
      - type: file
        path: wine-logo.svg
      - type: file
        path: org.winehq.Wine.metainfo.xml
